# IceGrid Node 1 Configuration

# Locator to connect to Registry
Ice.Default.Locator=IceGrid/Locator:tcp -h 172.20.0.2 -p 4061

# Node identity
IceGrid.Node.Name=node1
IceGrid.Node.Endpoints=tcp -h 172.20.0.10

# Node data directory
IceGrid.Node.Data=/app/icegrid/node1_data
IceGrid.Node.Output=/app/icegrid/node1_data

# Allow dynamic server registration
IceGrid.Node.AllowRunningServersAsRoot=1
IceGrid.Node.AllowEndpointsOverride=1

# Collocated mode disabled for distributed deployment
IceGrid.Node.CollocateRegistry=0

# Tracing
Ice.Trace.Locator=1
IceGrid.Node.Trace.Server=2
IceGrid.Node.Trace.Adapter=2

# Server activation timeout
IceGrid.Node.WaitTime=30
