# IceGrid Registry Configuration
IceGrid.InstanceName=Spotifice

IceGrid.Registry.Client.Endpoints=tcp -h 0.0.0.0 -p 4061
IceGrid.Registry.Server.Endpoints=tcp -h 0.0.0.0
IceGrid.Registry.Internal.Endpoints=tcp -h 0.0.0.0

IceGrid.Registry.LMDB.Path=/var/lib/ice/icegrid/registry
IceGrid.Registry.DynamicRegistration=1
IceGrid.Registry.AdminPermissionsVerifier=Spotifice/NullPermissionsVerifier
IceGrid.Registry.PermissionsVerifier=Spotifice/NullPermissionsVerifier

# Templates
IceGrid.Registry.DefaultTemplates=/usr/share/ice/templates.xml

# Tracing
Ice.ProgramName=icegridregistry (Spotifice)
IceGrid.Registry.Trace.Node=1
IceGrid.Registry.Trace.Adapter=1
