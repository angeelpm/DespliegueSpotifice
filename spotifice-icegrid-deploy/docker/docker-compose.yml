version: '3.8'

# ============================================
# Spotifice - Nivel Intermedio con Docker
# Imagen base de ZeroC + Python 
# ============================================

services:
  # ============================================
  # IceGrid Registry (imagen oficial)
  # ============================================
  registry:
    image: zeroc/icegridregistry:3.7
    container_name: icegrid-registry
    hostname: registry
    networks:
      spotifice-net:
        ipv4_address: 172.20.0.2
    ports:
      - "4061:4061"
    volumes:
      - ./config/registry.cfg:/etc/icegridregistry.conf:ro
      - ./config/application.xml:/config/application.xml:ro
      - registry-data:/var/lib/ice/icegrid/registry

  # ============================================
  # IceGrid Node 1 (con Python)
  # ============================================
  node1:
    image: spotifice-node:latest
    container_name: icegrid-node1
    hostname: node1
    networks:
      spotifice-net:
        ipv4_address: 172.20.0.10
    depends_on:
      - registry
    volumes:
      - ./config:/config:ro
      - ../:/app:ro
      - node1-data:/var/lib/ice/icegrid/node
    command: >
      icegridnode --Ice.Config=/config/node1.cfg

  # ============================================
  # IceGrid Node 2 (con Python)
  # ============================================
  node2:
    image: spotifice-node:latest
    container_name: icegrid-node2
    hostname: node2
    networks:
      spotifice-net:
        ipv4_address: 172.20.0.20
    depends_on:
      - registry
    volumes:
      - ./config:/config:ro
      - ../:/app:ro
      - node2-data:/var/lib/ice/icegrid/node
    command: >
      icegridnode --Ice.Config=/config/node2.cfg

networks:
  spotifice-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  registry-data:
  node1-data:
  node2-data:
