# Configuración del Registry IceGrid para Docker
IceGrid.InstanceName=SpotificeGrid

# Endpoints del Registry - accesible desde todos los contenedores
IceGrid.Registry.Client.Endpoints=tcp -h 0.0.0.0 -p 4061
IceGrid.Registry.Server.Endpoints=tcp -h 0.0.0.0
IceGrid.Registry.Internal.Endpoints=tcp -h 0.0.0.0

# Directorio de datos LMDB (versión 3.7)
IceGrid.Registry.LMDB.Path=/data/registry
IceGrid.Registry.DynamicRegistration=1

# Permisos de administración
IceGrid.Registry.AdminPermissionsVerifier=SpotificeGrid/NullPermissionsVerifier

# Logging
Ice.Trace.Network=0
Ice.Trace.Protocol=0

# Timeouts
Ice.Override.ConnectTimeout=5000
